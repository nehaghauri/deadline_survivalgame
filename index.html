<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deadline — Game Test</title>
    <link rel="stylesheet" href="HUD.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0d17;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #game-container canvas {
            display: block;
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #game-container.impact-shake {
            animation: impact-shake 0.4s ease;
        }

        @keyframes impact-shake {
            10%, 90% { transform: translateX(-4px); }
            20%, 80% { transform: translateX(8px); }
            30%, 50%, 70% { transform: translateX(-10px); }
            40%, 60% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Phaser injects its <canvas> in here -->
        <div id="hud"></div>
    </div>

    <div id="dialogue-box" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:600px; max-width:90vw; background:#1b1826; border:1px solid #302a41; border-radius:14px; padding:20px 24px; color:#f2eefb; font-family:sans-serif; z-index:10;">
        <p id="dialogue-title" style="font-weight:700; font-size:17px; margin:0 0 8px;"></p>
        <p id="dialogue-text" style="color:#d6d2e3; margin:0 0 14px; line-height:1.5;"></p>
        <div id="dialogue-choices" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div id="npc-greeting" style="display:none; opacity:0; transition:opacity 0.3s ease; position:fixed; top:20px; right:20px; max-width:280px; background:#1b1826; border:1px solid #302a41; border-radius:14px; padding:12px 16px; z-index:10; align-items:center; gap:12px; font-family:sans-serif;">
        <img id="npc-greeting-portrait" src="" style="width:56px; height:56px; border-radius:50%; object-fit:cover; background:#302a41; flex-shrink:0;">
        <div>
            <p id="npc-greeting-name" style="margin:0 0 4px; font-weight:700; font-size:13px; color:#f2eefb;"></p>
            <p id="npc-greeting-text" style="margin:0; font-size:12px; color:#d6d2e3; line-height:1.4;"></p>
        </div>
    </div>

    <!-- Phaser first -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

    <!-- Then state (defines gameState) -->
    <script src="state.js"></script>
    <script src="memory.js"></script>
    <script src="predictor.js"></script>
    <script src="gamify.js"></script>
    <script src="world-art.js"></script>
    <script src="arcade.js"></script>
    <script src="movement.js"></script>
    <script src="npcs.js"></script>
    <script src="polish.js"></script>

    <!-- Then HUD (reads gameState) -->
    <script src="HUD.js"></script>

    <!-- Then the game itself, which uses all of the above -->
    <script src="main.js"></script>

</body>
</html>
